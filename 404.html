<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · 页面走丢了 — Music Downloader</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root {
      --bg-a: #e8e9ee;
      --bg-b: #d7dbe8;
      --bg-c: #f2edea;
      --ink: #1d1d1f;
      --ink-2: #86868b;
      --ink-3: #b0b0b6;
      --card: rgba(255, 255, 255, 0.72);
      --card-border: rgba(255, 255, 255, 0.65);
      --line: rgba(0, 0, 0, 0.08);
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      --radius: 20px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
        "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background: #f5f5f7;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
      animation: pageIn 0.55s ease both;
    }
    @keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }

    .ambient {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(120% 90% at 12% 0%, var(--bg-a), transparent 60%),
        radial-gradient(110% 90% at 100% 15%, var(--bg-b), transparent 65%),
        radial-gradient(120% 110% at 50% 110%, var(--bg-c), transparent 70%);
    }
    .ambient::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.35);
    }

    .app {
      max-width: 720px;
      margin: 0 auto;
      padding: 18px 18px 80px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 4px 20px;
    }
    .brand { display: flex; align-items: center; gap: 9px; }
    .brand-mark {
      width: 34px; height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: linear-gradient(135deg, #fa6b57, #f0324b 45%, #a032c8);
      box-shadow: 0 4px 14px rgba(240, 50, 75, 0.35);
    }
    .brand-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .header-status {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--ink-2);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .header-status .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--ink-3);
    }

    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 0 40px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 44px 36px 40px;
      text-align: center;
      animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both;
    }

    .label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--ink-3);
      text-transform: uppercase;
      animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
    }

    .code {
      margin-top: 18px;
      font-size: 64px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -1.5px;
      color: var(--ink);
      animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.28s both;
    }

    .title {
      margin-top: 18px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
      animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.36s both;
    }

    .desc {
      margin-top: 10px;
      font-size: 15px;
      line-height: 1.6;
      color: var(--ink-2);
      letter-spacing: 0.2px;
      animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.44s both;
    }

    .home {
      margin-top: 30px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      border-radius: 12px;
      background: var(--ink);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 26px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.15s;
      animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.52s both;
    }
    .home:hover { opacity: 0.85; }
    .home:active { transform: scale(0.97); }
    .home svg { width: 15px; height: 15px; }

    .foot {
      text-align: center;
      font-size: 12px;
      color: var(--ink-3);
      letter-spacing: 1.5px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      .card { padding: 36px 24px 34px; }
      .code { font-size: 52px; }
      .title { font-size: 21px; }
    }
    @media (prefers-reduced-motion: reduce) {
      body, .card, .label, .code, .title, .desc, .home { animation-duration: 0.01s; animation-delay: 0s; }
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 3a9 9 0 0 0-9 9v9h9a9 9 0 0 0 0-18zm0 6a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg>
        </span>
        <span class="brand-name">Music Downloader</span>
      </div>
      <span class="header-status"><span class="dot" aria-hidden="true"></span>404 · NOT FOUND</span>
    </header>

    <div class="stage">
      <div class="card">
        <div class="label">Error 404</div>
        <div class="code">404</div>
        <div class="title">页面走丢了</div>
        <div class="desc">你访问的页面不存在或已被移动，<br />回首页继续听歌吧。</div>
        <a class="home" href="./">
          返回首页
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
    </div>

    <div class="foot">MUSIC DOWNLOADER · 404</div>
  </div>
</body>
</html>
