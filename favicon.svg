<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF7F0"/>
      <stop offset="1" stop-color="#EFE4D2"/>
    </linearGradient>
    <radialGradient id="vinyl" cx="0.4" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#2A2B2E"/>
      <stop offset="0.55" stop-color="#191A1C"/>
      <stop offset="1" stop-color="#0D0E10"/>
    </radialGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3C082"/>
      <stop offset="0.5" stop-color="#C9A15C"/>
      <stop offset="1" stop-color="#A9833F"/>
    </linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形背景 -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- 黑胶圆盘 -->
  <circle cx="512" cy="486" r="352" fill="url(#vinyl)"/>
  <g stroke="#FFFFFF" stroke-opacity="0.045" fill="none">
    <circle cx="512" cy="486" r="315" stroke-width="3"/>
    <circle cx="512" cy="486" r="272" stroke-width="2.5"/>
    <circle cx="512" cy="486" r="236" stroke-width="2.5"/>
    <circle cx="512" cy="486" r="204" stroke-width="2"/>
    <circle cx="512" cy="486" r="176" stroke-width="2"/>
  </g>
  <ellipse cx="452" cy="330" rx="235" ry="118" fill="url(#hi)" opacity="0.5" transform="rotate(-24 452 330)"/>

  <!-- 中心金色彩签 -->
  <circle cx="512" cy="486" r="132" fill="url(#label)"/>
  <circle cx="512" cy="486" r="124" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3"/>
  <circle cx="512" cy="486" r="8" fill="#8A6A33"/>

  <!-- 标准双八分音符 -->
  <g fill="#FFFFFF">
    <!-- 符头 -->
    <ellipse cx="487" cy="510" rx="31" ry="22" transform="rotate(-18 487 510)"/>
    <ellipse cx="577" cy="480" rx="31" ry="22" transform="rotate(-18 577 480)"/>
    <!-- 符杆 -->
    <rect x="514" y="402" width="13" height="106" rx="6.5"/>
    <rect x="604" y="372" width="13" height="106" rx="6.5"/>
    <!-- 横梁 -->
    <path d="M 511 418 L 615 388 L 626 404 L 522 434 Z"/>
  </g>

  <!-- 下载箭头（右下，细而精致） -->
  <g stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="702" y1="596" x2="702" y2="686"/>
    <polyline points="658,634 702,678 746,634"/>
    <line x1="634" y1="716" x2="770" y2="716"/>
  </g>
</svg>
