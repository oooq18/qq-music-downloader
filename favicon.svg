<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FA6B57"/>
      <stop offset="0.45" stop-color="#F0324B"/>
      <stop offset="1" stop-color="#A032C8"/>
    </linearGradient>
  </defs>

  <!-- 正圆背景（复刻网页 logo：border-radius 50%） -->
  <circle cx="512" cy="512" r="512" fill="url(#bg)"/>

  <!-- 白色黑胶唱片环（外环 r384 / 中心孔 r128，与原 SVG 比例一致） -->
  <path fill="#FFFFFF" fill-rule="evenodd"
        d="M512 128 a384 384 0 1 0 0 768 a384 384 0 0 0 0 -768 Z
           m0 256 a128 128 0 1 1 0 256 a128 128 0 0 1 0 -256 Z"/>
</svg>
