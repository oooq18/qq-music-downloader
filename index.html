<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>流浪地球 · 音乐终端</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <div class="scanline"></div>

  <div class="app">
    <header class="header">
      <div class="topbar">
        <span class="topbar-l">MUSIC TERMINAL // v2.2</span>
        <span class="topbar-r">EARTH UNITED GOVERNMENT</span>
      </div>
      <div class="logo">
        <div class="logo-icon">
          <span class="u">U</span><span class="e">E</span><span class="g">G</span>
        </div>
        <div class="logo-text">
          <h1>流浪地球 · 音乐终端</h1>
          <p class="subtitle">MUSIC DOWNLOAD TERMINAL / 550W 下载单元</p>
        </div>
      </div>
      <div class="dec-line"><span></span></div>
    </header>

    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input id="keyword" type="text" placeholder="输入歌曲名或歌手，如：周杰伦 / 晴天" />
      <button id="searchBtn">检索</button>
    </div>

    <div id="status" class="status"></div>

    <div id="resultMeta" class="result-meta"></div>
    <div id="songList" class="song-list"></div>

    <footer class="footer">仅供学习研究使用 · 请支持正版音乐 · 流浪地球 © 郭帆/中影</footer>
  </div>

  <!-- 底部播放器 -->
  <div id="player" class="player hidden">
    <div class="player-cover" id="playerCover"></div>
    <div class="player-info">
      <div class="player-name" id="playerName">未在播放</div>
      <div class="player-singer" id="playerSinger"></div>
      <div class="player-progress">
        <div class="progress-track"><div class="progress-fill" id="playerFill"></div></div>
        <div class="player-time"><span id="playerCur">00:00</span><span id="playerDur">00:00</span></div>
      </div>
    </div>
    <button id="playerPlay" class="player-play">▶</button>
    <button id="playerClose" class="player-close">✕</button>
  </div>

  <script src="config.js"></script>
  <script src="tags.js"></script>
  <script src="app.js"></script>
</body>
</html>
