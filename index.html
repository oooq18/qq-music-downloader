<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>音乐终端 · MUSIC TERMINAL</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <div class="scanline"></div>

  <div class="app">
    <header class="header">
      <div class="topbar">
        <span class="topbar-l">MUSIC TERMINAL // v2.2</span>
        <span class="topbar-r">AUDIO GRID // SECURE CHANNEL</span>
      </div>
      <div class="logo">
        <div class="logo-icon" aria-hidden="true">
          <span class="bar b1"></span><span class="bar b2"></span><span class="bar b3"></span><span class="bar b4"></span><span class="bar b5"></span>
        </div>
        <div class="logo-text">
          <h1>音乐终端</h1>
          <p class="subtitle">MUSIC DOWNLOAD TERMINAL / AUDIO GRID ONLINE</p>
        </div>
      </div>
      <div class="dec-line"><span></span></div>
    </header>

    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input id="keyword" type="text" placeholder="输入歌曲名或歌手，如：周杰伦 / 晴天" />
      <button id="searchBtn">检索</button>
    </div>

    <div id="status" class="status"></div>

    <div id="resultMeta" class="result-meta"></div>
    <div id="songList" class="song-list"></div>

    <footer class="footer">仅供学习研究使用 · 请支持正版音乐</footer>
  </div>

  <!-- 底部播放器 -->
  <div id="player" class="player hidden">
    <div class="player-cover" id="playerCover"></div>
    <div class="player-info">
      <div class="player-name" id="playerName">未在播放</div>
      <div class="player-singer" id="playerSinger"></div>
      <div class="player-progress">
        <div class="progress-track"><div class="progress-fill" id="playerFill"></div></div>
        <div class="player-time"><span id="playerCur">00:00</span><span id="playerDur">00:00</span></div>
      </div>
    </div>
    <button id="playerPlay" class="player-play" aria-label="播放或暂停">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button id="playerClose" class="player-close" aria-label="关闭播放器">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <script src="config.js"></script>
  <script src="tags.js"></script>
  <script src="app.js"></script>
</body>
</html>
