<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>音乐下载 · 在线播放与无损下载</title>
  <link rel="stylesheet" href="style.css?v=20261005" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="favicon-180x180.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#FBF7F0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="音乐下载" />
</head>
<body>
  <div class="ambient" id="ambient" aria-hidden="true"></div>

  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 3a9 9 0 0 0-9 9v9h9a9 9 0 0 0 0-18zm0 6a3 3 0 1 1 0 6 3 3 0 0 1 0-6z" opacity="0.9"/></svg>
        </span>
        <span class="brand-name">Music Downloader</span>
      </div>
      <span class="header-status" id="headerStatus"><span class="dot" aria-hidden="true"></span>STANDBY</span>
    </header>

    <section class="hero">
      <h1 class="hero-title">搜索 · 试听 · 下载</h1>
      <p class="hero-sub">海量歌曲在线试听，封面歌词无损内嵌</p>
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="keyword" type="text" placeholder="搜索歌曲或歌手" autocomplete="off" spellcheck="false" />
        <button id="searchBtn">搜索</button>
      </div>
      <div class="account-bar" id="accountBar" aria-label="下载账号"></div>
    </section>

    <div id="status" class="status"></div>
    <div id="resultMeta" class="result-meta"></div>
    <div id="songList" class="song-list"></div>
    <div id="pagination" class="pagination hidden">
      <button id="prevPage" class="page-btn">上一页</button>
      <span id="pageInfo" class="page-info"></span>
      <button id="nextPage" class="page-btn">下一页</button>
    </div>

    <footer class="footer">仅供学习研究使用 · 请支持正版音乐 · <span class="ver-tag">v20261005</span></footer>
  </div>

  <!-- 底部迷你播放条 -->
  <div id="player" class="player hidden">
    <div class="player-cover" id="playerCover">
      <span class="disc-hole"></span>
    </div>
    <div class="player-body" id="playerBody">
      <div class="player-name" id="playerName">未在播放</div>
      <div class="player-singer" id="playerSinger"></div>
    </div>
    <button id="playerPlay" class="player-play" aria-label="播放或暂停">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div class="player-progress"><div class="player-fill" id="playerFill"></div></div>
  </div>

  <!-- 正在播放全屏页 -->
  <div id="nowPlaying" class="now-playing hidden">
    <div class="np-handle" id="npHandle" title="收起"></div>
    <div class="np-header">
      <span class="np-title">正在播放</span>
    </div>

    <div class="np-cover-wrap">
      <div class="np-cover" id="npCover"></div>
    </div>

    <div class="np-info">
      <div class="np-name" id="npName"></div>
      <div class="np-singer" id="npSinger"></div>
    </div>

    <div class="np-progress">
      <div class="np-track" id="npTrack"><div class="np-fill" id="npFill"></div></div>
      <div class="np-time"><span id="npCur">0:00</span><span id="npDur">0:00</span></div>
    </div>

    <div class="np-controls">
      <button class="np-play" id="npPlay" aria-label="播放或暂停">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>

    <div class="np-lyrics-wrap">
      <div class="np-lyrics" id="lyricsEl"></div>
      <div class="np-lyrics-empty" id="lyricsEmpty">暂无歌词</div>
    </div>
  </div>

  <!-- 音质选择面板 -->
  <div id="dlModal" class="dl-modal hidden" role="dialog" aria-label="选择音质">
    <div class="dl-mask" id="dlMask"></div>
    <div class="dl-panel">
      <div class="dl-head">
        <div class="dl-cover" id="dlCover"></div>
        <div class="dl-info">
          <div class="dl-name" id="dlName"></div>
          <div class="dl-singer" id="dlSinger"></div>
        </div>
      </div>
      <button class="dl-listen" id="dlListen">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        试听预览
      </button>
      <div class="dl-acc" id="dlAcc"></div>
      <div class="dl-rows" id="dlRows"></div>
    </div>
  </div>

  <script src="config.js?v=20261005"></script>
  <script src="tags.js?v=20261005"></script>
  <script src="app.js?v=20261005"></script>
</body>
</html>
