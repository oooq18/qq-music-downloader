<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>音乐终端 · MUSIC TERMINAL</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <div class="app">
    <header class="header">
      <span class="brand-mark">音</span>
      <span class="brand-name">音乐终端</span>
      <span class="brand-en">MUSIC TERMINAL</span>
      <span class="header-status">ARCHIVE ONLINE</span>
    </header>

    <section class="hero">
      <p class="hero-eyebrow">AUDIO ARCHIVE</p>
      <h1 class="hero-title">音乐终端</h1>
      <p class="hero-sub">MUSIC TERMINAL</p>
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>
        </svg>
        <input id="keyword" type="text" placeholder="输入歌曲名或歌手，如：周杰伦 / 晴天" autocomplete="off" spellcheck="false" />
        <button id="searchBtn">检索</button>
      </div>
    </section>

    <div id="status" class="status"></div>
    <div id="resultMeta" class="result-meta"></div>
    <div id="songList" class="song-list"></div>

    <footer class="footer">仅供学习研究使用 · 请支持正版音乐</footer>
  </div>

  <!-- 底部播放器 -->
  <div id="player" class="player hidden">
    <div class="player-disc" id="playerCover">
      <span class="disc-hole"></span>
    </div>
    <div class="player-info">
      <div class="player-name" id="playerName">未在播放</div>
      <div class="player-singer" id="playerSinger"></div>
      <div class="player-progress">
        <div class="progress-track"><div class="progress-fill" id="playerFill"></div></div>
        <div class="player-time"><span id="playerCur">00:00</span><span id="playerDur">00:00</span></div>
      </div>
    </div>
    <button id="playerPlay" class="player-play" aria-label="播放或暂停">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button id="playerClose" class="player-close" aria-label="关闭播放器">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <script src="config.js"></script>
  <script src="tags.js"></script>
  <script src="app.js"></script>
</body>
</html>
