<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QQ 音乐下载器</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
        <h1>QQ 音乐下载器</h1>
      </div>
      <p class="subtitle">搜索歌曲，选择音质，一键下载无损音乐</p>
    </header>

    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input id="keyword" type="text" placeholder="搜索歌曲名或歌手，如 周杰伦 / 晴天" />
      <button id="searchBtn">搜索</button>
    </div>

    <div id="status" class="status"></div>

    <div id="resultMeta" class="result-meta"></div>
    <div id="songList" class="song-list"></div>

    <footer class="footer">仅供学习研究使用，请支持正版音乐</footer>
  </div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
